<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="490" viewBox="0 0 1440 490" role="img" aria-labelledby="title desc">
<title id="title">Beach Head — Battle Stations</title>
<desc id="desc">A coastal operations chart showing a ship, a fortified beach and the aircraft attack route. Three playable missions: sea, sky and beach.</desc>
<defs>
