  <linearGradient id="shore" x2="1" y2="1"><stop stop-color="#b4a184"/><stop offset="1" stop-color="#384941"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#d0e5e1" stroke-opacity=".05"/></pattern>
  <radialGradient id="glow"><stop stop-color="#639f9a" stop-opacity=".22"/><stop offset="1" stop-color="#639f9a" stop-opacity="0"/></radialGradient>
</defs>
